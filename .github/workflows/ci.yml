name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and SQLite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          dotnet-version: '8.0.x'
      - run: dotnet restore Trexon.Data.slnx
      - run: dotnet build Trexon.Data.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true -warnaserror
      - run: dotnet test --solution Trexon.Data.slnx --configuration Release --no-build --no-restore
      - run: dotnet run --project examples/Trexon.Data.Sample --configuration Release --no-build
      - run: dotnet pack Trexon.Data/Trexon.Data.csproj --configuration Release --no-build --output artifacts -p:ContinuousIntegrationBuild=true -warnaserror
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages-${{ matrix.os }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 14

  databases:
    name: PostgreSQL, MySQL and SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: trexon-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: trexon-ci-only
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptrexon-ci-only"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TREXON_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=trexon-ci-only;Database=postgres
      TREXON_TEST_MYSQL: Server=localhost;Port=3306;User ID=root;Password=trexon-ci-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          dotnet-version: '8.0.x'
      - run: dotnet restore Trexon.Data.slnx
      - run: dotnet build Trexon.Data.slnx --configuration Release --no-restore -warnaserror
      - run: dotnet test --solution Trexon.Data.slnx --configuration Release --no-build --no-restore
